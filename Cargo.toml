[package]
name = "eja"
version = "0.14.0"
edition = "2021"
description = "EJA/AJA minimal closed loop"
repository = "https://github.com/beyyuanzhang/eja"
license = "MIT"
readme = "README.md"
keywords = ["agent", "kernel", "journal", "llm", "workflow"]
categories = ["development-tools", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros", "process", "io-util"] }
rmcp = { version = "3.9", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
libc = "0.2"

# The lint policy this crate holds itself to. Pedantic and nursery are on, and
# the two that do not fit this codebase are named here rather than silently
# ignored at each site:
#
# - missing_errors_doc: every fallible function states its refusals in prose, in
#   the vocabulary of the contract (a turn, a budget, an authority). A generated
#   "# Errors" list would restate the same sentences in a second voice.
# - too_many_lines: the turn loop and the projection are each one sequence that
#   a reader follows top to bottom; splitting them would scatter the contract
#   across functions that only that sequence calls.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
too_many_lines = "allow"
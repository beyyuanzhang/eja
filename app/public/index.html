<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8f7f2" />
    <title>eja</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden;
        background: #f8f7f2;
        color: #24231f;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
      }
      .boot-dot {
        width: 8px; height: 8px; border-radius: 50%; background: #bd6042;
        box-shadow: 0 0 0 0 rgba(189, 96, 66, .28);
        animation: boot-breathe 1.8s ease-out infinite;
      }
      .boot-label { color: #7d796f; font-size: 12px; letter-spacing: .04em; }
      .boot-help { display: none; max-width: 36rem; padding: 0 24px; text-align: center; }
      .boot-help p { color: #716d63; }
      #boot.help-mode .boot-help { display: block; }
      .boot-help h1 { margin: 0 0 8px; font: 400 28px/1.2 Georgia, serif; }
      .boot-help p { margin: 0; }
      .boot-help pre {
        margin: 18px 0 12px; padding: 14px 18px; border: 1px solid #e2ded3;
        border-radius: 10px; background: #fffefb; color: #37352f; text-align: left;
      }
      @keyframes boot-breathe {
        0% { box-shadow: 0 0 0 0 rgba(189, 96, 66, .28); }
        70% { box-shadow: 0 0 0 8px rgba(189, 96, 66, 0); }
        100% { box-shadow: 0 0 0 0 rgba(189, 96, 66, 0); }
      }
    </style>
    <script>
      if (window.location.protocol === "file:") {
        window.addEventListener("DOMContentLoaded", function () {
          var boot = document.getElementById("boot");
          if (!boot) return;
          boot.classList.add("help-mode");
          boot.innerHTML =
            '<div class="boot-help"><h1>请通过 HTTP 打开</h1>' +
            '<p>运行时与前端是两个独立服务，静态文件不能连接 eja。</p>' +
            '<pre>cargo run -- serve --dir .eja --project .\nnpm --prefix app/frontend run preview</pre>' +
            '<p>然后打开 http://127.0.0.1:4173</p></div>';
        });
      }
    </script>
    <script type="module" crossorigin src="./assets/index-D6axwUUF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-w-3klxP1.css">
  </head>
  <body>
    <div id="boot" aria-live="polite">
      <span class="boot-dot"></span>
      <span class="boot-label">正在唤醒 eja…</span>
    </div>
    <div id="app"></div>
  </body>
</html>

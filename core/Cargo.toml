[package]
name = "eja-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
onnx = ["dep:fastembed"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlite-vec = "=0.1.7"
fastembed = { optional = true, version = "=7.7.1", default-features = false, features = ["ort-download-binaries-native-tls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "semantic_recall"
required-features = ["onnx"]

[[example]]
name = "live_continuity"
required-features = ["onnx"]

[package]
name = "eja-host"
version.workspace = true
edition = "2021"
publish = false

[features]
default = []
onnx = ["eja-memory/onnx"]

[dependencies]
eja-core = { path = "../core" }
eja-memory = { path = "../memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

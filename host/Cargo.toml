[package]
name = "eja-host"
version.workspace = true
edition = "2021"
publish = false

[features]
default = ["onnx"]
onnx = ["eja-memory/onnx"]

[dependencies]
base64 = "0.23"
eja-core = { path = "../core" }
eja-memory = { path = "../memory" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
